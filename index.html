<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <form>
                <div>
                    <input type="text" class="display" name="display">
                </div>
                <div>
                    <input type="button" class="splbutton" value="AC" onclick="display.value = '' ">
                    <input type="button" class="splbutton" value="DE" onclick="display.value =  display.value.toString().slice(0,-1)" >
                    <input type="button" class="splbutton" value="." onclick="display.value += '.' ">
                    <input type="button" class="splbutton" value="/" onclick="display.value += '/' ">
                </div>
                <div>
                    <input type="button" value="7" onclick="display.value += '7' ">
                    <input type="button" value="8" onclick="display.value += '8' ">
                    <input type="button" value="9" onclick="display.value += '9' ">
                    <input type="button" class="splbutton" value="*" onclick="display.value += '*' ">
                </div>
                <div>
                    <input type="button" value="4" onclick="display.value += '4' ">
                    <input type="button" value="5" onclick="display.value += '5' ">
                    <input type="button" value="6" onclick="display.value += '6' ">
                    <input type="button" class="splbutton" value="-" onclick="display.value += '-' ">
                </div>
                <div>
                    <input type="button" value="1" onclick="display.value += '1' ">
                    <input type="button" value="2" onclick="display.value += '2' ">
                    <input type="button" value="3" onclick="display.value += '3' ">
                    <input type="button" class="splbutton" value="+" onclick="display.value += '+' ">
                </div>
                <div>
                    <input type="button" class="bigbutton" value="00" onclick="display.value += '00' ">
                    <input type="button" value="0" onclick="display.value += '0' ">
                    <input type="button" class="splbutton " value="=" onclick="display.value = eval(display.value) ">
                </div>
            </form>
        </div>
    </div>
    <style>
        *{
            padding: 0;
            margin: 0;
            font: optional;
            box-sizing: border-box;
        }
        
        .container{
            width: 100%;
            height: 100vh;
            background-color: #e3f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calculator{
            background-color: #3a4452;
            padding: 20px;
            border-radius: 10px;
            }
        input{
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid black;
            margin-bottom: 4px;
            background-color: #bac4c7;
        
        }
        .bigbutton{
            width: 82.5px;
            height: 40px;
        }
        .display{
            width: 170px;
            height: 40px;
            text-align: right;
            font-size: 30px;
        }
        .splbutton{
            background-color: rgb(241, 175, 52);
        }
        
    </style>
</body>
</html
